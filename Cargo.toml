[workspace]
resolver = "3"
members = [
    "crates/sidebar-core",
    "crates/sidebar-render",
    "crates/sidebar-widgets",
    "crates/sidebar-platform",
    "crates/sidebar-sysinfo",
    "crates/sidebar-online",
    "crates/sidebar-app",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
repository = "https://github.com/cksandal/sidebar"

[workspace.dependencies]
sidebar-core = { path = "crates/sidebar-core" }
sidebar-render = { path = "crates/sidebar-render" }
sidebar-widgets = { path = "crates/sidebar-widgets" }
sidebar-platform = { path = "crates/sidebar-platform" }
sidebar-sysinfo = { path = "crates/sidebar-sysinfo" }
sidebar-online = { path = "crates/sidebar-online" }
serde = { version = "1", features = ["derive"] }
toml = "1"
# Edits the config file in place (settings window), keeping comments.
toml_edit = "0.25"
serde_json = "1"
ureq = "3"

[package]
name = "sidebar-sysinfo"
description = "Per-OS implementations of sidebar-core data sources (CPU, memory, GPU, network, battery, time zone)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
sidebar-core.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
# localtime_r for the UTC offset (honours TZ and /etc/localtime, incl. DST);
# dlopen for NVML; getifaddrs.
libc = "0.2"

[target.'cfg(windows)'.dependencies.windows-sys]
version = "0.61"
features = [
    "Wdk_System_SystemInformation",
    "Win32_Foundation",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_NetworkManagement_WiFi",
    "Win32_Networking_WinSock",
    "Win32_System_LibraryLoader",
    "Win32_System_Performance",
    "Win32_System_Power",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Time",
    "Win32_System_WindowsProgramming",
]
